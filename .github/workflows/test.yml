name: Test FUDforum

on:
  push:
    branches: [ master ]
  #pull_request:
  #  branches: [ master ]
  
jobs:
  test:
    runs-on: ${{ matrix.os }}
    services:
      mariadb:
        image: mariadb:latest
        ports:
          - 3306
        env:
          MYSQL_USER: fuduser
          MYSQL_PASSWORD: fudpass
          MYSQL_DATABASE: fuddb
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      fail-fast: true
      matrix:
        #os: [ubuntu-latest, windows-latest]
        os: [ubuntu-latest]
        php: [8.2, 8.3, 8.4, 8.5, 8.6]
        
    name: PHP ${{ matrix.php }} - ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
            
      - name: Install FUDforum
        run: |
             php create_fudforum_archive install 1 > fudforum_archive
             mkdir forum
             cp install.php fudforum_archive forum/
             cd forum
             pwd
             cat << EOF > install.ini
             WWW_ROOT         = "http://127.0.0.1:8080/forum/"
             SERVER_ROOT      = "${{ github.workspace }}/forum"
             SERVER_DATA_ROOT = "${{ github.workspace }}/forum"
             DBHOST           = 127.0.0.1:${{ job.services.mariadb.ports[3306] }}
             DBHOST_USER      = fuduser
             DBHOST_PASSWORD  = fudpass
             DBHOST_DBNAME    = fuddb
             DBHOST_TBL_PREFIX= fud30_
             DBHOST_DBTYPE    = mysqli
             COOKIE_DOMAIN    = 127.0.0.1
             LANGUAGE         = en
             TEMPLATE         = default
             ROOT_LOGIN       = admin
             ROOT_PASS        = admin
             ADMIN_EMAIL      = "me@nowhere.com"
             EOF
             pwd
             cat install.ini
             php -d error_reporting=E_ALL -d display_errors=1 ./install.php install.ini
             
      - name: Upgrade FUDforum
        run: |
             cp upgrade.php fudforum_archive forum/
             cd forum
             pwd
             php -d error_reporting=E_ALL -d display_errors=1 ./upgrade.php admin admin

      - name: Check for syntax errors
        run: |
             errors=0
             while IFS= read -r file; do
               php -l "$file" || errors=1
             done < <(find ./forum/ -name "*.php")
             exit $errors
           
